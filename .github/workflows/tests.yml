name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: Linux fast tests
            os: ubuntu-latest
            pytest_args: -m "not slow"
          - name: Apple Silicon fast tests
            os: macos-latest
            pytest_args: -m "not slow"
          - name: Apple Silicon model tests
            os: macos-latest
            pytest_args: -m slow
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q ${{ matrix.pytest_args }}
